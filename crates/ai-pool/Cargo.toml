[package]
name = "ai-pool"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Fault-tolerant client for OpenAI-compatible APIs with key pooling, rotation, per-key rate quotas, and encrypted key storage."
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewiththiha/ai-pool"
readme = "../../README.md"
keywords = ["ai", "openai", "api-key", "rotation", "rate-limit"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["derive"]
# Typed schemas from `#[derive(JsonSchema)]`.
derive = ["dep:schemars"]
# Encrypted key store in one SQLite file.
sqlite = ["dep:rusqlite"]
# Master key in the OS credential store.
os-keychain = ["dep:keyring"]
# Server-sent event streaming.
stream = ["dep:futures-util", "reqwest/stream"]

[dependencies]
tokio = { version = "1.43", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
dashmap = "6.1"
aes-gcm = "0.10"
rand = "0.9"
zeroize = "1.8"
hex = "0.4"
sha2 = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
schemars = { version = "0.8", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
# Secret Service over pure-Rust D-Bus: persistent, no system libraries.
keyring = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
tempfile = "3.15"
rusqlite = { version = "0.40", features = ["bundled"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
